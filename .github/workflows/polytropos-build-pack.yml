name: Polytropos Build + Pack

on:
  workflow_dispatch:
  push:
    tags:
      - "v*poly.*"

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--max-old-space-size=6144"
  OPENCLAW_TSDOWN_NODE_OPTIONS: "--max-old-space-size=6144"
  NODE_VERSION: "24.15.0"
  POLYTROPOS_PACKAGE_INVENTORY_ARTIFACT: polytropos-package-inventory
  POLYTROPOS_GITHUB_PACKAGES_REGISTRY: https://npm.pkg.github.com

jobs:
  resolve_release_target:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.validate.outputs.should_run }}
      release_tag: ${{ steps.validate.outputs.release_tag }}
      expected_branch: ${{ steps.validate.outputs.expected_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag branch ancestry
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_tag="${REF_NAME}"
          if [[ ! "${release_tag}" =~ ^v([0-9]{4}\.[0-9]+\.[0-9]+)\+poly\.[0-9]+$ ]]; then
            echo "Tag ${release_tag} does not match the Polytropos release format; skipping build."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${BASH_REMATCH[1]}"
          expected_branch="release/${version}"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "expected_branch=${expected_branch}" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin "+refs/heads/${expected_branch}:refs/remotes/origin/${expected_branch}"
          tag_sha="$(git rev-list -n 1 "${release_tag}")"
          if git merge-base --is-ancestor "${tag_sha}" "refs/remotes/origin/${expected_branch}"; then
            echo "Tag ${release_tag} resolves to ${tag_sha} and is reachable from ${expected_branch}."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${release_tag} resolves to ${tag_sha} but is not reachable from ${expected_branch}; skipping build."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  build_pack:
    needs: resolve_release_target
    if: needs.resolve_release_target.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "false"
          install-deps: "false"

      - name: Runner resources
        run: |
          echo "MemTotal:"; grep MemTotal /proc/meminfo || true
          echo "SwapTotal:"; grep SwapTotal /proc/meminfo || true
          free -h || true

      - name: Install
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
          PNPM_CONFIG_MINIMUM_RELEASE_AGE_IGNORE_MISSING_TIME: "true"
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          OPENCLAW_BUILD_ALL_NO_PNPM: "1"
        run: node scripts/build-all.mjs ciArtifacts

      - name: Build Control UI
        env:
          OPENCLAW_BUILD_ALL_NO_PNPM: "1"
        run: pnpm ui:build
      - name: Compute artifact tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            release_package_version="$(
              node -e 'const ref = process.argv[1]; const match = /^v(\d{4}\.\d+\.\d+)\+poly\.([1-9]\d*)$/.exec(ref); if (!match) { process.exit(1); } process.stdout.write(`${match[1]}-${match[2]}`);' \
                "${GITHUB_REF_NAME}"
            )"
            echo "RELEASE_PACKAGE_VERSION=${release_package_version}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=" >> "$GITHUB_ENV"
            echo "RELEASE_PACKAGE_VERSION=" >> "$GITHUB_ENV"
          fi
      - name: Pack
        id: pack
        env:
          OPENCLAW_PREPACK_USE_PREPARED_ARTIFACTS: "1"
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          # Build the tarball; do NOT trust stdout formatting
          npm pack --silent > /tmp/npm-pack.out
          tgz=$(ls -1 *.tgz | tail -n 1)
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          ls -la "$tgz"
      - name: Write build metadata
        run: |
          PNPM_VERSION="$(pnpm -v)" node -e "const fs=require(\"fs\"); const pkg=require(\"./package.json\"); fs.writeFileSync(\"build-metadata.json\", JSON.stringify({name:pkg.name, version:pkg.version, sha:process.env.GITHUB_SHA, node:process.version, node_options:process.env.NODE_OPTIONS, pnpm:process.env.PNPM_VERSION, releaseTag: process.env.RELEASE_TAG || null}, null, 2));"
      - name: Configure GitHub Packages npm auth
        if: github.ref_type == 'tag'
        id: github_packages_auth
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_scope="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            printf '@%s:registry=%s\n' "${package_scope}" "${POLYTROPOS_GITHUB_PACKAGES_REGISTRY}"
            printf '//npm.pkg.github.com/:_authToken=%s\n' "${NODE_AUTH_TOKEN}"
            printf 'always-auth=true\n'
          } > "${HOME}/.npmrc"
          echo "package_scope=${package_scope}" >> "$GITHUB_OUTPUT"
      - name: Upload package artifact
        if: github.ref_type == 'tag'
        id: upload_core_artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-tgz-${{ env.RELEASE_TAG }}
          path: ${{ steps.pack.outputs.tgz }}
          if-no-files-found: error
          retention-days: 14

      - name: Prepare core GitHub Packages tarball
        if: github.ref_type == 'tag'
        id: prepare_core_github_package
        run: |
          set -euo pipefail
          mkdir -p .local/github-packages
          published_name="@${{ steps.github_packages_auth.outputs.package_scope }}/openclaw-polytropos-core"
          output_tgz=".local/github-packages/$(basename "${{ steps.pack.outputs.tgz }}")"
          node scripts/polytropos-prepare-github-package-tarball.mjs \
            --input "${{ steps.pack.outputs.tgz }}" \
            --output "${output_tgz}" \
            --published-name "${published_name}" \
            --published-version "${RELEASE_PACKAGE_VERSION}" \
            --repository-url "git+https://github.com/${GITHUB_REPOSITORY}.git"
          echo "published_name=${published_name}" >> "$GITHUB_OUTPUT"
          echo "tgz=${output_tgz}" >> "$GITHUB_OUTPUT"

      - name: Publish core GitHub Package
        if: github.ref_type == 'tag'
        env:
          PACKAGE_NAME: ${{ steps.prepare_core_github_package.outputs.published_name }}
          PACKAGE_VERSION: ${{ env.RELEASE_PACKAGE_VERSION }}
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry "${POLYTROPOS_GITHUB_PACKAGES_REGISTRY}" >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already published to GitHub Packages."
            exit 0
          fi
          npm publish "${{ steps.prepare_core_github_package.outputs.tgz }}" --tag latest --registry "${POLYTROPOS_GITHUB_PACKAGES_REGISTRY}"

      - name: Pack acpx plugin artifact
        if: github.ref_type == 'tag'
        id: pack_acpx
        run: |
          set -euo pipefail
          plugin_pack_dir="${GITHUB_WORKSPACE}/.local/plugin-packages"
          mkdir -p "${plugin_pack_dir}"
          node scripts/lib/plugin-npm-runtime-build.mjs extensions/acpx
          tgz="$(
            OPENCLAW_PLUGIN_NPM_BUNDLE_DEPENDENCIES=1 \
              node scripts/lib/plugin-npm-package-manifest.mjs --run extensions/acpx -- \
              npm pack --ignore-scripts --pack-destination "${plugin_pack_dir}" | tail -n 1
          )"
          version="$(node -p 'require("./extensions/acpx/package.json").version')"
          echo "tgz=${plugin_pack_dir}/${tgz}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Prepare acpx GitHub Packages tarball
        if: github.ref_type == 'tag'
        id: prepare_acpx_github_package
        run: |
          set -euo pipefail
          published_name="@${{ steps.github_packages_auth.outputs.package_scope }}/openclaw-polytropos-acpx"
          output_tgz=".local/github-packages/$(basename "${{ steps.pack_acpx.outputs.tgz }}")"
          node scripts/polytropos-prepare-github-package-tarball.mjs \
            --input "${{ steps.pack_acpx.outputs.tgz }}" \
            --output "${output_tgz}" \
            --published-name "${published_name}" \
            --published-version "${RELEASE_PACKAGE_VERSION}" \
            --repository-url "git+https://github.com/${GITHUB_REPOSITORY}.git" \
            --install-npm-spec "${published_name}"
          echo "published_name=${published_name}" >> "$GITHUB_OUTPUT"
          echo "tgz=${output_tgz}" >> "$GITHUB_OUTPUT"

      - name: Publish acpx GitHub Package
        if: github.ref_type == 'tag'
        env:
          PACKAGE_NAME: ${{ steps.prepare_acpx_github_package.outputs.published_name }}
          PACKAGE_VERSION: ${{ env.RELEASE_PACKAGE_VERSION }}
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry "${POLYTROPOS_GITHUB_PACKAGES_REGISTRY}" >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already published to GitHub Packages."
            exit 0
          fi
          npm publish "${{ steps.prepare_acpx_github_package.outputs.tgz }}" --tag latest --registry "${POLYTROPOS_GITHUB_PACKAGES_REGISTRY}"

      - name: Pack brave plugin artifact
        if: github.ref_type == 'tag'
        id: pack_brave
        run: |
          set -euo pipefail
          plugin_pack_dir="${GITHUB_WORKSPACE}/.local/plugin-packages"
          mkdir -p "${plugin_pack_dir}"
          node scripts/lib/plugin-npm-runtime-build.mjs extensions/brave
          tgz="$(
            OPENCLAW_PLUGIN_NPM_BUNDLE_DEPENDENCIES=1 \
              node scripts/lib/plugin-npm-package-manifest.mjs --run extensions/brave -- \
              npm pack --ignore-scripts --pack-destination "${plugin_pack_dir}" | tail -n 1
          )"
          version="$(node -p 'require("./extensions/brave/package.json").version')"
          echo "tgz=${plugin_pack_dir}/${tgz}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Prepare brave GitHub Packages tarball
        if: github.ref_type == 'tag'
        id: prepare_brave_github_package
        run: |
          set -euo pipefail
          published_name="@${{ steps.github_packages_auth.outputs.package_scope }}/openclaw-polytropos-brave-plugin"
          output_tgz=".local/github-packages/$(basename "${{ steps.pack_brave.outputs.tgz }}")"
          node scripts/polytropos-prepare-github-package-tarball.mjs \
            --input "${{ steps.pack_brave.outputs.tgz }}" \
            --output "${output_tgz}" \
            --published-name "${published_name}" \
            --published-version "${RELEASE_PACKAGE_VERSION}" \
            --repository-url "git+https://github.com/${GITHUB_REPOSITORY}.git" \
            --install-npm-spec "${published_name}"
          echo "published_name=${published_name}" >> "$GITHUB_OUTPUT"
          echo "tgz=${output_tgz}" >> "$GITHUB_OUTPUT"

      - name: Publish brave GitHub Package
        if: github.ref_type == 'tag'
        env:
          PACKAGE_NAME: ${{ steps.prepare_brave_github_package.outputs.published_name }}
          PACKAGE_VERSION: ${{ env.RELEASE_PACKAGE_VERSION }}
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry "${POLYTROPOS_GITHUB_PACKAGES_REGISTRY}" >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already published to GitHub Packages."
            exit 0
          fi
          npm publish "${{ steps.prepare_brave_github_package.outputs.tgz }}" --tag latest --registry "${POLYTROPOS_GITHUB_PACKAGES_REGISTRY}"

      - name: Pack codex plugin artifact
        if: github.ref_type == 'tag'
        id: pack_codex
        run: |
          set -euo pipefail
          plugin_pack_dir="${GITHUB_WORKSPACE}/.local/plugin-packages"
          mkdir -p "${plugin_pack_dir}"
          node scripts/lib/plugin-npm-runtime-build.mjs extensions/codex
          tgz="$(
            OPENCLAW_PLUGIN_NPM_BUNDLE_DEPENDENCIES=1 \
              node scripts/lib/plugin-npm-package-manifest.mjs --run extensions/codex -- \
              npm pack --ignore-scripts --pack-destination "${plugin_pack_dir}" | tail -n 1
          )"
          version="$(node -p 'require("./extensions/codex/package.json").version')"
          echo "tgz=${plugin_pack_dir}/${tgz}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Prepare codex GitHub Packages tarball
        if: github.ref_type == 'tag'
        id: prepare_codex_github_package
        run: |
          set -euo pipefail
          published_name="@${{ steps.github_packages_auth.outputs.package_scope }}/openclaw-polytropos-codex"
          output_tgz=".local/github-packages/$(basename "${{ steps.pack_codex.outputs.tgz }}")"
          node scripts/polytropos-prepare-github-package-tarball.mjs \
            --input "${{ steps.pack_codex.outputs.tgz }}" \
            --output "${output_tgz}" \
            --published-name "${published_name}" \
            --published-version "${RELEASE_PACKAGE_VERSION}" \
            --repository-url "git+https://github.com/${GITHUB_REPOSITORY}.git" \
            --install-npm-spec "${published_name}"
          echo "published_name=${published_name}" >> "$GITHUB_OUTPUT"
          echo "tgz=${output_tgz}" >> "$GITHUB_OUTPUT"

      - name: Publish codex GitHub Package
        if: github.ref_type == 'tag'
        env:
          PACKAGE_NAME: ${{ steps.prepare_codex_github_package.outputs.published_name }}
          PACKAGE_VERSION: ${{ env.RELEASE_PACKAGE_VERSION }}
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry "${POLYTROPOS_GITHUB_PACKAGES_REGISTRY}" >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already published to GitHub Packages."
            exit 0
          fi
          npm publish "${{ steps.prepare_codex_github_package.outputs.tgz }}" --tag latest --registry "${POLYTROPOS_GITHUB_PACKAGES_REGISTRY}"

      - name: Pack discord plugin artifact
        if: github.ref_type == 'tag'
        id: pack_discord
        run: |
          set -euo pipefail
          plugin_pack_dir="${GITHUB_WORKSPACE}/.local/plugin-packages"
          mkdir -p "${plugin_pack_dir}"
          node scripts/lib/plugin-npm-runtime-build.mjs extensions/discord
          tgz="$(
            OPENCLAW_PLUGIN_NPM_BUNDLE_DEPENDENCIES=1 \
              node scripts/lib/plugin-npm-package-manifest.mjs --run extensions/discord -- \
              npm pack --ignore-scripts --pack-destination "${plugin_pack_dir}" | tail -n 1
          )"
          version="$(node -p 'require("./extensions/discord/package.json").version')"
          echo "tgz=${plugin_pack_dir}/${tgz}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Prepare discord GitHub Packages tarball
        if: github.ref_type == 'tag'
        id: prepare_discord_github_package
        run: |
          set -euo pipefail
          published_name="@${{ steps.github_packages_auth.outputs.package_scope }}/openclaw-polytropos-discord"
          output_tgz=".local/github-packages/$(basename "${{ steps.pack_discord.outputs.tgz }}")"
          node scripts/polytropos-prepare-github-package-tarball.mjs \
            --input "${{ steps.pack_discord.outputs.tgz }}" \
            --output "${output_tgz}" \
            --published-name "${published_name}" \
            --published-version "${RELEASE_PACKAGE_VERSION}" \
            --repository-url "git+https://github.com/${GITHUB_REPOSITORY}.git" \
            --install-npm-spec "${published_name}"
          echo "published_name=${published_name}" >> "$GITHUB_OUTPUT"
          echo "tgz=${output_tgz}" >> "$GITHUB_OUTPUT"

      - name: Publish discord GitHub Package
        if: github.ref_type == 'tag'
        env:
          PACKAGE_NAME: ${{ steps.prepare_discord_github_package.outputs.published_name }}
          PACKAGE_VERSION: ${{ env.RELEASE_PACKAGE_VERSION }}
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry "${POLYTROPOS_GITHUB_PACKAGES_REGISTRY}" >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already published to GitHub Packages."
            exit 0
          fi
          npm publish "${{ steps.prepare_discord_github_package.outputs.tgz }}" --tag latest --registry "${POLYTROPOS_GITHUB_PACKAGES_REGISTRY}"

      - name: Wait for GitHub Packages visibility
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          specs=(
            "@${{ steps.github_packages_auth.outputs.package_scope }}/openclaw-polytropos-core@${RELEASE_PACKAGE_VERSION}"
            "@${{ steps.github_packages_auth.outputs.package_scope }}/openclaw-polytropos-acpx@${RELEASE_PACKAGE_VERSION}"
            "@${{ steps.github_packages_auth.outputs.package_scope }}/openclaw-polytropos-brave-plugin@${RELEASE_PACKAGE_VERSION}"
            "@${{ steps.github_packages_auth.outputs.package_scope }}/openclaw-polytropos-codex@${RELEASE_PACKAGE_VERSION}"
            "@${{ steps.github_packages_auth.outputs.package_scope }}/openclaw-polytropos-discord@${RELEASE_PACKAGE_VERSION}"
          )
          for spec in "${specs[@]}"; do
            for attempt in $(seq 1 12); do
              if npm view "${spec}" version --registry "${POLYTROPOS_GITHUB_PACKAGES_REGISTRY}" >/dev/null 2>&1; then
                echo "Visible: ${spec}"
                break
              fi
              if [ "${attempt}" -eq 12 ]; then
                echo "Timed out waiting for ${spec} to appear in GitHub Packages." >&2
                exit 1
              fi
              sleep 5
            done
          done

      - name: Generate package inventory
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p .local
          tracked_plugins="$(jq -r '.[] | select(. != "openclaw")' .github/polytropos-tracked-packages.json | paste -sd, -)"
          previous_release_tag="$(git tag -l 'v*+poly.*' | grep -Fxv "${RELEASE_TAG}" | sort -V | tail -n 1 || true)"

          inventory_args=(
            --tracked-packages-file .github/polytropos-tracked-packages.json
            --output .local/polytropos-package-inventory.json
            --release-tag "${RELEASE_TAG}"
            --published-version "${RELEASE_PACKAGE_VERSION}"
            --repository "${GITHUB_REPOSITORY}"
            --workflow-run-id "${GITHUB_RUN_ID}"
            --github-package-scope "${{ steps.github_packages_auth.outputs.package_scope }}"
            --package-registry-url "${POLYTROPOS_GITHUB_PACKAGES_REGISTRY}"
            --plugins "${tracked_plugins}"
          )
          if [ -n "${previous_release_tag}" ]; then
            inventory_args+=(--base-ref "${previous_release_tag}" --head-ref "${RELEASE_TAG}")
          fi

          node --import tsx scripts/polytropos-package-inventory.ts "${inventory_args[@]}"

      - name: Upload package inventory artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.POLYTROPOS_PACKAGE_INVENTORY_ARTIFACT }}-${{ env.RELEASE_TAG }}
          path: .local/polytropos-package-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload dist/ (debug)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-dist-${{ env.RELEASE_TAG }}
          path: |
            dist
            ui/dist
          if-no-files-found: warn
          retention-days: 7
