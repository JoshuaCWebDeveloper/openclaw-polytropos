name: Polytropos Build + Pack

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*poly.*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--max-old-space-size=6144"
  OPENCLAW_TSDOWN_NODE_OPTIONS: "--max-old-space-size=6144"
  NODE_VERSION: "24.15.0"
  PNPM_VERSION: "11.0.8"

jobs:
  build_pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install-bun: "false"

      - name: Runner resources
        run: |
          echo "MemTotal:"; grep MemTotal /proc/meminfo || true
          echo "SwapTotal:"; grep SwapTotal /proc/meminfo || true
          free -h || true

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Build Control UI
        run: pnpm build:ui

      - name: Compute artifact tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        id: pack
        run: |
          npm pack
          TGZ=$(ls -1 *.tgz | tail -n 1)
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"

      - name: Write build metadata
        run: |
          node -e 'console.log(JSON.stringify({sha: process.env.GITHUB_SHA, ref: process.env.GITHUB_REF}, null, 2))' > build-metadata.json

      - name: Upload package artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-tgz-${{ steps.tag.outputs.tag }}
          path: ${{ steps.pack.outputs.tgz }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload dist/ (debug)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-dist-${{ steps.tag.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
