name: Polytropos Build + Pack

on:
  workflow_dispatch:
  push:
    tags:
      - "v*poly.*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--max-old-space-size=6144"
  OPENCLAW_TSDOWN_NODE_OPTIONS: "--max-old-space-size=6144"
  NODE_VERSION: "24.15.0"
  POLYTROPOS_PACKAGE_INVENTORY_ARTIFACT: polytropos-package-inventory

jobs:
  resolve_release_target:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.validate.outputs.should_run }}
      release_tag: ${{ steps.validate.outputs.release_tag }}
      expected_branch: ${{ steps.validate.outputs.expected_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag branch ancestry
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_tag="${REF_NAME}"
          if [[ ! "${release_tag}" =~ ^v([0-9]{4}\.[0-9]+\.[0-9]+)\+poly\.[0-9]+$ ]]; then
            echo "Tag ${release_tag} does not match the Polytropos release format; skipping build."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${BASH_REMATCH[1]}"
          expected_branch="release/${version}"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "expected_branch=${expected_branch}" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin "+refs/heads/${expected_branch}:refs/remotes/origin/${expected_branch}"
          tag_sha="$(git rev-list -n 1 "${release_tag}")"
          if git merge-base --is-ancestor "${tag_sha}" "refs/remotes/origin/${expected_branch}"; then
            echo "Tag ${release_tag} resolves to ${tag_sha} and is reachable from ${expected_branch}."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${release_tag} resolves to ${tag_sha} but is not reachable from ${expected_branch}; skipping build."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  build_pack:
    needs: resolve_release_target
    if: needs.resolve_release_target.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "false"
          install-deps: "false"

      - name: Runner resources
        run: |
          echo "MemTotal:"; grep MemTotal /proc/meminfo || true
          echo "SwapTotal:"; grep SwapTotal /proc/meminfo || true
          free -h || true

      - name: Install
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
          PNPM_CONFIG_MINIMUM_RELEASE_AGE_IGNORE_MISSING_TIME: "true"
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          OPENCLAW_BUILD_ALL_NO_PNPM: "1"
        run: node scripts/build-all.mjs ciArtifacts

      - name: Build Control UI
        run: pnpm ui:build
      - name: Compute artifact tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=" >> "$GITHUB_ENV"
          fi
      - name: Pack
        id: pack
        env:
          OPENCLAW_PREPACK_USE_PREPARED_ARTIFACTS: "1"
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          # Build the tarball; do NOT trust stdout formatting
          npm pack --silent > /tmp/npm-pack.out
          tgz=$(ls -1 *.tgz | tail -n 1)
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          ls -la "$tgz"
      - name: Write build metadata
        run: |
          PNPM_VERSION="$(pnpm -v)" node -e "const fs=require(\"fs\"); const pkg=require(\"./package.json\"); fs.writeFileSync(\"build-metadata.json\", JSON.stringify({name:pkg.name, version:pkg.version, sha:process.env.GITHUB_SHA, node:process.version, node_options:process.env.NODE_OPTIONS, pnpm:process.env.PNPM_VERSION, releaseTag: process.env.RELEASE_TAG || null}, null, 2));"
      - name: Upload package artifact
        if: github.ref_type == 'tag'
        id: upload_core_artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-tgz-${{ env.RELEASE_TAG }}
          path: ${{ steps.pack.outputs.tgz }}
          if-no-files-found: error
          retention-days: 14

      - name: Pack acpx plugin artifact
        if: github.ref_type == 'tag'
        id: pack_acpx
        run: |
          set -euo pipefail
          mkdir -p .local/plugin-packages
          node scripts/lib/plugin-npm-runtime-build.mjs extensions/acpx
          pack_json="$(
            OPENCLAW_PLUGIN_NPM_BUNDLE_DEPENDENCIES=1 \
              node scripts/lib/plugin-npm-package-manifest.mjs --run extensions/acpx -- \
              npm pack --json --ignore-scripts --pack-destination .local/plugin-packages
          )"
          tgz="$(printf '%s\n' "${pack_json}" | jq -r '.[0].filename')"
          echo "tgz=.local/plugin-packages/${tgz}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p \"require('./extensions/acpx/package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Upload acpx plugin artifact
        if: github.ref_type == 'tag'
        id: upload_acpx_artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-plugin-acpx-tgz-${{ env.RELEASE_TAG }}
          path: ${{ steps.pack_acpx.outputs.tgz }}
          if-no-files-found: error
          retention-days: 14

      - name: Pack brave plugin artifact
        if: github.ref_type == 'tag'
        id: pack_brave
        run: |
          set -euo pipefail
          mkdir -p .local/plugin-packages
          node scripts/lib/plugin-npm-runtime-build.mjs extensions/brave
          pack_json="$(
            OPENCLAW_PLUGIN_NPM_BUNDLE_DEPENDENCIES=1 \
              node scripts/lib/plugin-npm-package-manifest.mjs --run extensions/brave -- \
              npm pack --json --ignore-scripts --pack-destination .local/plugin-packages
          )"
          tgz="$(printf '%s\n' "${pack_json}" | jq -r '.[0].filename')"
          echo "tgz=.local/plugin-packages/${tgz}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p \"require('./extensions/brave/package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Upload brave plugin artifact
        if: github.ref_type == 'tag'
        id: upload_brave_artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-plugin-brave-tgz-${{ env.RELEASE_TAG }}
          path: ${{ steps.pack_brave.outputs.tgz }}
          if-no-files-found: error
          retention-days: 14

      - name: Pack codex plugin artifact
        if: github.ref_type == 'tag'
        id: pack_codex
        run: |
          set -euo pipefail
          mkdir -p .local/plugin-packages
          node scripts/lib/plugin-npm-runtime-build.mjs extensions/codex
          pack_json="$(
            OPENCLAW_PLUGIN_NPM_BUNDLE_DEPENDENCIES=1 \
              node scripts/lib/plugin-npm-package-manifest.mjs --run extensions/codex -- \
              npm pack --json --ignore-scripts --pack-destination .local/plugin-packages
          )"
          tgz="$(printf '%s\n' "${pack_json}" | jq -r '.[0].filename')"
          echo "tgz=.local/plugin-packages/${tgz}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p \"require('./extensions/codex/package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Upload codex plugin artifact
        if: github.ref_type == 'tag'
        id: upload_codex_artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-plugin-codex-tgz-${{ env.RELEASE_TAG }}
          path: ${{ steps.pack_codex.outputs.tgz }}
          if-no-files-found: error
          retention-days: 14

      - name: Pack discord plugin artifact
        if: github.ref_type == 'tag'
        id: pack_discord
        run: |
          set -euo pipefail
          mkdir -p .local/plugin-packages
          node scripts/lib/plugin-npm-runtime-build.mjs extensions/discord
          pack_json="$(
            OPENCLAW_PLUGIN_NPM_BUNDLE_DEPENDENCIES=1 \
              node scripts/lib/plugin-npm-package-manifest.mjs --run extensions/discord -- \
              npm pack --json --ignore-scripts --pack-destination .local/plugin-packages
          )"
          tgz="$(printf '%s\n' "${pack_json}" | jq -r '.[0].filename')"
          echo "tgz=.local/plugin-packages/${tgz}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p \"require('./extensions/discord/package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Upload discord plugin artifact
        if: github.ref_type == 'tag'
        id: upload_discord_artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-plugin-discord-tgz-${{ env.RELEASE_TAG }}
          path: ${{ steps.pack_discord.outputs.tgz }}
          if-no-files-found: error
          retention-days: 14

      - name: Generate package inventory
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p .local
          resolve_artifact_url() {
            local artifact_name="$1"
            local artifact_id
            artifact_id="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --jq ".artifacts[] | select(.name == \"${artifact_name}\") | .id" \
                | head -n 1
            )"
            if [ -z "${artifact_id}" ]; then
              echo "Failed to resolve artifact id for ${artifact_name}" >&2
              exit 1
            fi
            printf 'https://github.com/%s/actions/runs/%s/artifacts/%s\n' \
              "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" "${artifact_id}"
          }

          core_artifact_url="$(resolve_artifact_url "openclaw-tgz-${RELEASE_TAG}")"
          tracked_plugins="$(jq -r '.[] | select(. != "openclaw")' .github/polytropos-tracked-packages.json | paste -sd, -)"
          previous_release_tag="$(git tag -l 'v*+poly.*' | grep -Fxv "${RELEASE_TAG}" | sort -V | tail -n 1 || true)"

          cat > .local/polytropos-plugin-artifacts.json <<EOF
          [
            {
              "packageName": "@openclaw/acpx",
              "version": "${{ steps.pack_acpx.outputs.version }}",
              "artifactFile": "${{ steps.pack_acpx.outputs.tgz }}",
              "artifactUrl": "$(resolve_artifact_url "openclaw-plugin-acpx-tgz-${RELEASE_TAG}")"
            },
            {
              "packageName": "@openclaw/brave-plugin",
              "version": "${{ steps.pack_brave.outputs.version }}",
              "artifactFile": "${{ steps.pack_brave.outputs.tgz }}",
              "artifactUrl": "$(resolve_artifact_url "openclaw-plugin-brave-tgz-${RELEASE_TAG}")"
            },
            {
              "packageName": "@openclaw/codex",
              "version": "${{ steps.pack_codex.outputs.version }}",
              "artifactFile": "${{ steps.pack_codex.outputs.tgz }}",
              "artifactUrl": "$(resolve_artifact_url "openclaw-plugin-codex-tgz-${RELEASE_TAG}")"
            },
            {
              "packageName": "@openclaw/discord",
              "version": "${{ steps.pack_discord.outputs.version }}",
              "artifactFile": "${{ steps.pack_discord.outputs.tgz }}",
              "artifactUrl": "$(resolve_artifact_url "openclaw-plugin-discord-tgz-${RELEASE_TAG}")"
            }
          ]
          EOF

          inventory_args=(
            --tracked-packages-file .github/polytropos-tracked-packages.json
            --output .local/polytropos-package-inventory.json
            --release-tag "${RELEASE_TAG}"
            --repository "${GITHUB_REPOSITORY}"
            --workflow-run-id "${GITHUB_RUN_ID}"
            --core-artifact-url "${core_artifact_url}"
            --core-artifact-file "${{ steps.pack.outputs.tgz }}"
            --plugin-artifacts-file .local/polytropos-plugin-artifacts.json
            --plugins "${tracked_plugins}"
          )
          if [ -n "${previous_release_tag}" ]; then
            inventory_args+=(--base-ref "${previous_release_tag}" --head-ref "${RELEASE_TAG}")
          fi

          node --import tsx scripts/polytropos-package-inventory.ts "${inventory_args[@]}"

      - name: Upload package inventory artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.POLYTROPOS_PACKAGE_INVENTORY_ARTIFACT }}-${{ env.RELEASE_TAG }}
          path: .local/polytropos-package-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload dist/ (debug)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-dist-${{ env.RELEASE_TAG }}
          path: |
            dist
            ui/dist
          if-no-files-found: warn
          retention-days: 7
